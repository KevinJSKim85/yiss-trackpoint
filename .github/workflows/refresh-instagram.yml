name: Refresh Instagram snapshots

# Runs 05:00 KST daily (20:00 UTC previous day) plus on-demand button in
# the Actions tab. Scraper failures never fail the workflow — the old
# snapshot is simply kept until the next successful run.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install curl_cffi Pillow

      - name: Run scraper
        # Scraper is designed to exit 0 even on Instagram-side failures;
        # `|| true` is belt-and-suspenders so a hard crash never fails CI.
        run: python scripts/refresh_instagram.py || true

      - name: Commit snapshot changes
        run: |
          if [ -z "$(git status --porcelain public/instagram)" ]; then
            echo "No Instagram snapshot changes to commit."
            exit 0
          fi
          git config user.name "yiss-trackpoint-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/instagram
          git commit -m "chore: refresh Instagram snapshots"
          git push
